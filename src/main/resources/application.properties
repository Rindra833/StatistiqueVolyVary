spring.application.name=VolyVary

# Force UTF-8 pour les requêtes et réponses HTTP, y compris les pages JSP et leurs fragments.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Résolution des vues JSP placées sous WEB-INF afin qu'elles ne soient jamais accessibles directement.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/volyvary_db
spring.datasource.username=postgres
spring.datasource.password=POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate : Met à jour les tables automatiquement (pratique en développement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Amorçage optionnel du premier administrateur (ne pas stocker de secret ici)
app.bootstrap-admin.nom=${VOLYVARY_ADMIN_NOM:}
app.bootstrap-admin.password=${VOLYVARY_ADMIN_PASSWORD:}
app.bootstrap-admin.role=${VOLYVARY_ADMIN_ROLE:Administrateur}

# Base isolée : les tests ne lisent et ne modifient jamais PostgreSQL partagé par le groupe.
spring.datasource.url=jdbc:h2:mem:volyvary_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Le projet rend des JSP ; la dépendance thymeleaf-test existante ne doit pas prendre leur priorité.
spring.autoconfigure.exclude=org.springframework.boot.thymeleaf.autoconfigure.ThymeleafAutoConfiguration

# Aucun compte de démonstration n'est inséré pendant les tests.
app.bootstrap-admin.nom=
app.bootstrap-admin.password=

spring.application.name=volyVary

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/volyvary_db
spring.datasource.username=postgres
spring.datasource.password=POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Amorçage optionnel du premier administrateur (ne pas stocker de secret ici)
app.bootstrap-admin.nom=${VOLYVARY_ADMIN_NOM:admin}
app.bootstrap-admin.password=${VOLYVARY_ADMIN_PASSWORD:2006}
app.bootstrap-admin.role=${VOLYVARY_ADMIN_ROLE:Administrateur}

server.port=8080

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
